name: Update CDOT US 550

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: cdot-us550-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main

      - name: Retrieve CDOT road conditions
        env:
          CDOT_API_KEY: ${{ secrets.CDOT_API_KEY }}
        run: python3 scripts/fetch_cdot.py

      - name: Commit public condition data safely
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/cdot_us550.json /tmp/cdot_us550.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            cp /tmp/cdot_us550.json data/cdot_us550.json
            git add data/cdot_us550.json
            if git diff --cached --quiet; then
              echo "No CDOT data changes to publish."
              exit 0
            fi
            git commit -m 'Update CDOT US 550 road data'
            if git push origin HEAD:main; then
              echo "Published CDOT data successfully."
              exit 0
            fi
            echo "Concurrent update detected; retrying on latest main (${attempt}/5)."
            sleep 2
          done
          echo "Failed to publish CDOT data after retries." >&2
          exit 1
