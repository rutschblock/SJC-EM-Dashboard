name: NWS DSS Packet freshness check
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-dss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf
      - run: python scripts/check_dss_packet.py
      - name: Commit refreshed DSS metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dss_packet.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh NWS DSS packet freshness metadata"
            git push
          fi
