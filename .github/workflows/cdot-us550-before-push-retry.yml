
name: Update CDOT US 550

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve CDOT road conditions
        env:
          CDOT_API_KEY: ${{ secrets.CDOT_API_KEY }}
        run: python3 scripts/fetch_cdot.py

      - name: Commit public condition data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cdot_us550.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update CDOT US 550 road data'
            git push
          fi
